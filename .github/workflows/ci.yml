name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test
        run: |
          node dist/cli.mjs --demo --no-open --port 4399 > server.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:4399/api/state > /dev/null && break; sleep 0.2; done
          curl -sf http://127.0.0.1:4399/api/sessions | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const n=JSON.parse(s).sessions.length;console.log(n+' sessions');if(n<50)process.exit(1)})"
          curl -sf http://127.0.0.1:4399/ | grep -q '<div id="root">'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artifacts/
