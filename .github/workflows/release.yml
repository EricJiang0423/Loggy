name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v0.5.0 (must match package.json)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check version matches tag
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: Package
        run: npm pack
      - name: Release notes
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Install

          Requires Node.js 22.12+.

          \`\`\`sh
          npx --yes https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/loggy-${VERSION}.tgz
          # or
          npm install -g https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/loggy-${VERSION}.tgz && loggy
          \`\`\`
          NOTES
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Creates the tag at this commit when it does not exist yet (manual runs).
        run: gh release create "$TAG" loggy-*.tgz --target "$GITHUB_SHA" --title "Loggy $TAG" --notes-file notes.md
