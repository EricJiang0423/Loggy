name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check version matches tag
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Package
        run: npm pack
      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Install

          Requires Node.js 22.12+.

          \`\`\`sh
          npx --yes https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/loggy-${VERSION}.tgz
          # or
          npm install -g https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/loggy-${VERSION}.tgz && loggy
          \`\`\`
          NOTES
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" loggy-*.tgz --title "Loggy $GITHUB_REF_NAME" --notes-file notes.md
